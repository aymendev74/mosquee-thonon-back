logging:
  config: ./config/logback-spring.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 100
    threads:
      max: 100
spring:
  http:
    client:
      # Sans plafond, un appel Gemini bloqué immobiliserait une connexion JDBC et le verrou de
      # moth.chatbot_index_state pendant toute la réindexation transactionnelle (et bloquerait le
      # démarrage d'une seconde instance). S'applique au RestClient.Builder auto-configuré, dont
      # le client Gemini est aujourd'hui le seul consommateur.
      connect-timeout: 10s
      read-timeout: 60s
  jackson:
    default-property-inclusion: non_null
  profiles:
    active: dev
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
    enabled: true
    defaultSchema: moth
    user: ${DB_LIQ_USERNAME}
    password: ${DB_LIQ_PASSWORD}
  datasource:
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    username: ${DB_USERNAME}
  jpa:
    hibernate:
      ddl-auto: none
      show-sql: true
    properties:
      hibernate:
        default_schema: moth
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    password: ${MAIL_SERVICE_PASSWORD}
    username:  ${MAIL_SERVICE_USERNAME}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
scheduled:
  confirmation-mail: 60 # unit = seconds
  activation-utilisateur-mail: 60 # unit = seconds
  reset-password-mail: 60 # unit = seconds
  document-generation: 30 # unit = seconds

app:
  token-uri: ${TOKEN_URI}
  login-redirect-uri: ${LOGIN_REDIRECT_URI}
  logout-redirect-uri: ${LOGOUT_REDIRECT_URI}
  allowed-origins: ${ALLOWED_ORIGINS}
  issuer-uri: ${ISSUER_URI}
  reset-password-uri: ${RESET_PASSWORD_URI}
  jwt-decoder-uri: ${JWT_DECODER_URI}
  activation-utilisateur-uri: ${ACTIVATION_UTILISATEUR_URI}
  resource-lock-timeout: ${RESOURCE_LOCK_TIMEOUT}
  rib-amc:
    file-location: ${RIB_AMC_FILE_LOCATION}
    mail-attachment-filename: ${RIB_AMC_MAIL_ATTACHMENT_NAME}
  documents:
    base-path: ${DOCUMENTS_BASE_PATH}

auth:
  cookie:
    secure: ${COOKIE_SECURE}
    path: /api
    name: MOTH-TOKEN
    same-site: Lax

chatbot:
  gemini:
    api-key: ${GEMINI_API_KEY}
    embedding-model: gemini-embedding-001
    # DOIT rester synchronisé avec moth.chatbot_document_chunk.embedding vector(768) (changelog 063).
    # Sans cette valeur, gemini-embedding-001 renvoie 3072 dimensions par défaut, non insérables et
    # non indexables (l'index HNSW pgvector plafonne à 2000 dimensions). Toute modification impose
    # un changeset Liquibase + une réindexation complète.
    embedding-dimension: 768
    generation-model: gemini-3.1-flash-lite
    # Volontairement basse : réponses factuelles et respect strict du format de sortie imposé par
    # l'instruction système (pas de titres, pas de tableaux, pas de blocs de code).
    temperature: 0.2
    base-url: https://generativelanguage.googleapis.com/v1beta
  retrieval:
    top-k: 5
    min-score: 0.55
  indexing:
    enabled: true
    check-interval: 60 # unit = seconds
  docs-path: ${CHATBOT_DOCS_PATH:docs/functional}