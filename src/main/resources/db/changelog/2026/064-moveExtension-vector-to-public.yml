databaseChangeLog:
  - changeSet:
      id: 064-moveExtension-vector-to-public
      author: Aymen
      comment: >
        Le CREATE EXTENSION du changelog 063 n'était pas qualifié : il a hérité du search_path de
        Liquibase (spring.liquibase.defaultSchema = moth) et a donc installé pgvector dans le schéma
        moth. Le type, l'opérateur <=> et l'opclass vector_cosine_ops s'y trouvent aussi. Or
        l'application se connecte sans currentSchema (search_path = "$user", public) : les tables
        fonctionnent car elles sont qualifiées explicitement, mais un opérateur ne peut pas l'être
        implicitement, d'où "operator does not exist: moth.vector <=> moth.vector" à la première
        recherche de similarité. On replace l'extension dans public, son emplacement conventionnel,
        ce qui la rend résolvable quel que soit le search_path.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF EXISTS (SELECT 1
                           FROM pg_extension e
                           JOIN pg_namespace n ON n.oid = e.extnamespace
                           WHERE e.extname = 'vector' AND n.nspname <> 'public') THEN
                  ALTER EXTENSION vector SET SCHEMA public;
                END IF;
              END
              $$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF EXISTS (SELECT 1
                           FROM pg_extension e
                           JOIN pg_namespace n ON n.oid = e.extnamespace
                           WHERE e.extname = 'vector' AND n.nspname = 'public') THEN
                  ALTER EXTENSION vector SET SCHEMA moth;
                END IF;
              END
              $$;
