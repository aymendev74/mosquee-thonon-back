logging:
    level:
        root: INFO

chatbot:
    indexing:
        # Le job d'indexation démarre avec le contexte Spring : sans ce false, chaque @SpringBootTest
        # de la suite appellerait réellement l'API Gemini.
        enabled: false

spring:
    liquibase:
        enabled: false
    datasource:
        driverClassName: org.h2.Driver
        password: test
        url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=60000;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
        username: test
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                default_schema: moth
                format_sql: true
                show_sql: false
        show-sql: true

